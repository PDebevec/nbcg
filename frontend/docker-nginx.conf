# Serves the built SPA to the edge nginx. No TLS and no /api proxying here —
# both belong to the edge, which is the only thing that talks to this container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Vite fingerprints asset filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves browsers pointing at
    # asset names that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The router is in hash mode (quasar.config.ts vueRouterMode: 'hash'), so
    # every route is served by index.html and no history fallback is needed.
    # $uri is still tried first for real files: favicon, icons, and
    # silent-check-sso.html, which keycloak-js loads in a hidden iframe.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
