name: nbcg

# Shared by every service below: bounds each container's own stdout capture so
# a noisy/crash-looping container can't fill the host disk. Doesn't apply to
# nginx (prod-only, defined in docker-compose.prod.yml) — it writes directly
# to files on the nginx-logs volume, which this driver-level setting can't
# touch; that needs its own solution (stdout symlink or a logrotate sidecar).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

volumes:
##### POSTGRES
  postgres-data:
##### PGADMIN
  pgadmin-data:
##### KEYCLOAK
  keycloak-data:
##### OPENSEARCH
  opensearch-data:
##### REDIS
  redis-data:
##### SEAWEEDFS
  seaweedfs-data:

services:
##### POSTGRESQL #####
  db:
    image: postgres:18.3
    restart: unless-stopped
    shm_size: 1024mb
    command: [ "postgres", "-c", "wal_level=logical" ]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
     - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

##### PGADMIN #####
  pgadmin:
    image: dpage/pgadmin4:9.12.0
    restart: unless-stopped
    logging: *default-logging
    volumes:
     - ./infrastructure/docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
     - pgadmin-data:/var/lib/pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      # pgAdmin takes ~30s to boot gunicorn and load servers.json. Without
      # this, those first failures count against `retries` and the container
      # is briefly reported unhealthy even though it comes up fine.
      start_period: 60s

##### REDIS #####
  redis:
    image: redis:8.6.1
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

##### KEYCLOAK DATABASE #####
  keycloak-db:
    image: postgres:18.3
    restart: unless-stopped
    logging: *default-logging
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD}
      POSTGRES_USER: ${KEYCLOAK_POSTGRES_USER}
      POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
     - keycloak-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_POSTGRES_USER} -d ${KEYCLOAK_POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

##### KEYCLOAK #####
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.4
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./infrastructure/docker/keycloak/nbcg-realm.json:/opt/keycloak/data/import/nbcg-realm.json
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_HEALTH_ENABLED: true
      # KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD were renamed in Keycloak 26;
      # the old names still work but log a deprecation warning on every start.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      # in-network address: must be the container port, not the published one
      KC_DB_URL: jdbc:postgresql://keycloak-db:${KEYCLOAK_POSTGRES_PORT_INTERNAL}/${KEYCLOAK_POSTGRES_DB}
      KC_DB_USERNAME: ${KEYCLOAK_POSTGRES_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD}
    healthcheck:
      # The Keycloak image ships no curl and no wget, so the probe is done with
      # bash's /dev/tcp. Health lives on the management port (9000), not on
      # 8080 — Keycloak moved it there in 25.x.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

##### PGSYNC #####
  pgsync:
    # Pinned by digest, not tag: upstream has never published a version-
    # numbered tag, only `latest` — and it moves (confirmed: the tag pointed
    # at a different image than this digest as of this pin). A digest is
    # actually more reproducible than the version tags used elsewhere in this
    # file, just less human-readable.
    image: toluaina1/pgsync@sha256:3dad547f2f428db79302fa807bc3ea438186a2ff63b364f52ed6a29420f1b547
    restart: unless-stopped
    logging: *default-logging
    environment:
      - REDIS_CHECKPOINT=true
      - REDIS_HOST=redis
      - PG_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
      - ELASTICSEARCH_URL=http://opensearch-node:${OPENSEARCH_NODE_P1_INTERNAL}
      - ELASTICSEARCH=false
      - OPENSEARCH=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      opensearch-node:
        condition: service_healthy
    volumes:
      - ./infrastructure/docker/pgsync/schema.json:/app/schema.json
    command: -c schema.json -d -b

##### OPENSEARCH #####
  opensearch-node:
    image: opensearchproject/opensearch:3.5.0
    restart: unless-stopped
    logging: *default-logging
    # Heap is capped at 512m below (OPENSEARCH_JAVA_OPTS); this bounds the
    # container's total memory (heap + Lucene off-heap + filesystem cache) so
    # a runaway doesn't take down the whole host — ~3x heap is the usual
    # headroom rule of thumb for this JVM/heap size.
    mem_limit: 1500m
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node
      - discovery.seed_hosts=opensearch-node
      - cluster.initial_cluster_manager_nodes=opensearch-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.5.0
    restart: unless-stopped
    logging: *default-logging
    depends_on:
     - opensearch-node
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch-node:${OPENSEARCH_NODE_P1_INTERNAL}"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

##### SEAWEEDFS #####
# Only master + volume: the backend talks exclusively to those two (its own
# low-level "needle" API — assign an id, then upload/download/delete by id).
# filer/s3/webdav were a separate, optional gateway layer nothing in this
# codebase ever called; removed entirely (see infrastructure/README.md).
  master:
    image: chrislusf/seaweedfs:4.23
    restart: unless-stopped
    logging: *default-logging
    command: 'master -ip=master -ip.bind=0.0.0.0 -metricsPort=9324'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9333/cluster/status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
  volume:
    image: chrislusf/seaweedfs:4.23
    volumes:
      - seaweedfs-data:/data
    restart: unless-stopped
    logging: *default-logging
    command: 'volume -ip=volume -master="master:9333" -ip.bind=0.0.0.0 -port=8080 -metricsPort=9325'
    depends_on:
      master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s